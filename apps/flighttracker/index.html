<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/images/ico.ico" type="image/x-icon">
    <title>Flight Tracker | Verdis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('/storage/css/themes.css');

        :root {
            --background-image: url('/images/backgrounds/retro/appsbg.jpg');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--background-color);
            background-image: var(--background-image);
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .flight-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px var(--text-glow);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-bottom: 30px;
            color: var(--text-color);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .back-link:hover {
            opacity: 1;
        }

        .controls {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-color2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background-color: rgba(0, 0, 0, 0.4);
            color: var(--text-color);
            padding: 12px 16px;
            border: 2px solid var(--border-color2);
            border-radius: 12px;
            font-family: var(--font-family);
            font-size: 16px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--border-color1);
            box-shadow: 0 0 15px var(--text-glow);
        }

        button {
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 12px 24px;
            border: 2px solid var(--border-color2);
            border-radius: 12px;
            font-family: var(--font-family);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background-color: var(--hover-color);
            border-color: var(--border-color1);
            box-shadow: 0 0 15px var(--text-glow);
        }

        .info-text {
            opacity: 0.7;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        #map {
            height: 600px;
            border: 2px solid var(--border-color2);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-color2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px var(--text-glow);
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .flights-list {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-color2);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            max-height: 400px;
            overflow-y: auto;
        }

        .flight-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color2);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .flight-item:hover {
            background: var(--hover-color);
            border-color: var(--border-color1);
            transform: translateX(5px);
        }

        .flight-callsign {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .flight-details {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            opacity: 0.7;
        }

        .error {
            background: rgba(255, 50, 50, 0.2);
            border-color: #ff4444;
            color: #ffaaaa;
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
        }

        /* Leaflet marker customization */
        .plane-marker {
            background: none;
            border: none;
        }

        .plane-icon {
            font-size: 24px;
            transform-origin: center;
        }
    </style>
</head>
<body>
    <div class="flight-container">
        <h1>✈️ Flight Tracker</h1>
        <a href="/index.html" class="back-link">← Back to Portfolio</a>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="callsignInput" placeholder="Search by flight callsign (e.g., UAL123)">
                <button onclick="searchFlight()">Search Flight</button>
                <button onclick="loadAllFlights()">Show All Flights</button>
            </div>
            <div class="info-text">
                Showing live flight data using OpenSky Network API. Click on flights in the list to center them on the map.
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="flightCount">0</div>
                <div class="stat-label">Flights Tracked</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgAltitude">0</div>
                <div class="stat-label">Avg Altitude (m)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgSpeed">0</div>
                <div class="stat-label">Avg Speed (km/h)</div>
            </div>
        </div>

        <div id="map"></div>

        <div class="flights-list">
            <h3 style="margin-bottom: 15px;">Active Flights</h3>
            <div id="flightsList">
                <div class="loading">Loading flight data...</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/storage/js/theme.js"></script>
    <script>
        let map;
        let flightMarkers = {};
        let allFlights = [];

        // Initialize map
        function initMap() {
            map = L.map('map').setView([20, 0], 2);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
        }

        // Load all flights
        async function loadAllFlights() {
            const flightsList = document.getElementById('flightsList');
            flightsList.innerHTML = '<div class="loading">Loading flight data...</div>';
            
            try {
                // Use OpenSky Network API - get all flights
                const response = await fetch('https://opensky-network.org/api/states/all');
                const data = await response.json();
                
                if (!data.states || data.states.length === 0) {
                    flightsList.innerHTML = '<div class="error">No flights found</div>';
                    return;
                }

                // Filter out flights with null positions
                allFlights = data.states
                    .filter(state => state[5] !== null && state[6] !== null)
                    .map(state => ({
                        callsign: (state[1] || '').trim(),
                        origin: state[2] || '',
                        longitude: state[5],
                        latitude: state[6],
                        altitude: state[7] || 0,
                        velocity: state[9] || 0,
                        heading: state[10] || 0,
                        onGround: state[8] || false,
                        lastUpdate: state[4]
                    }))
                    .filter(f => f.callsign && !f.onGround)
                    .slice(0, 50); // Limit to 50 flights for performance

                displayFlights(allFlights);
                updateStats(allFlights);
                
            } catch (error) {
                console.error('Error loading flights:', error);
                flightsList.innerHTML = '<div class="error">Failed to load flight data. Please try again.</div>';
            }
        }

        // Search for specific flight
        async function searchFlight() {
            const callsign = document.getElementById('callsignInput').value.trim().toUpperCase();
            if (!callsign) {
                alert('Please enter a flight callsign');
                return;
            }

            const flightsList = document.getElementById('flightsList');
            flightsList.innerHTML = '<div class="loading">Searching for flight...</div>';

            try {
                const response = await fetch(`https://opensky-network.org/api/states/all`);
                const data = await response.json();
                
                const flight = data.states
                    .filter(state => state[5] !== null && state[6] !== null)
                    .map(state => ({
                        callsign: (state[1] || '').trim(),
                        origin: state[2] || '',
                        longitude: state[5],
                        latitude: state[6],
                        altitude: state[7] || 0,
                        velocity: state[9] || 0,
                        heading: state[10] || 0,
                        onGround: state[8] || false,
                        lastUpdate: state[4]
                    }))
                    .find(f => f.callsign === callsign);

                if (flight) {
                    displayFlights([flight]);
                    updateStats([flight]);
                    centerOnFlight(flight);
                } else {
                    flightsList.innerHTML = `<div class="error">Flight ${callsign} not found</div>`;
                }
            } catch (error) {
                console.error('Error searching flight:', error);
                flightsList.innerHTML = '<div class="error">Failed to search flight. Please try again.</div>';
            }
        }

        // Display flights on map and list
        function displayFlights(flights) {
            // Clear existing markers
            Object.values(flightMarkers).forEach(marker => map.removeLayer(marker));
            flightMarkers = {};

            // Add new markers
            flights.forEach(flight => {
                const marker = L.marker([flight.latitude, flight.longitude], {
                    icon: L.divIcon({
                        className: 'plane-marker',
                        html: `<div class="plane-icon" style="transform: rotate(${flight.heading}deg);">✈️</div>`,
                        iconSize: [30, 30]
                    })
                }).addTo(map);

                marker.bindPopup(`
                    <strong>${flight.callsign}</strong><br>
                    Altitude: ${Math.round(flight.altitude)}m<br>
                    Speed: ${Math.round(flight.velocity * 3.6)} km/h<br>
                    Heading: ${Math.round(flight.heading)}°
                `);

                flightMarkers[flight.callsign] = marker;
            });

            // Update flights list
            const flightsList = document.getElementById('flightsList');
            flightsList.innerHTML = flights.map(flight => `
                <div class="flight-item" onclick="centerOnFlight(${JSON.stringify(flight).replace(/"/g, '&quot;')})">
                    <div class="flight-callsign">${flight.callsign}</div>
                    <div class="flight-details">
                        Altitude: ${Math.round(flight.altitude)}m • 
                        Speed: ${Math.round(flight.velocity * 3.6)} km/h • 
                        Heading: ${Math.round(flight.heading)}°
                    </div>
                </div>
            `).join('');
        }

        // Center map on specific flight
        function centerOnFlight(flight) {
            map.setView([flight.latitude, flight.longitude], 8);
            if (flightMarkers[flight.callsign]) {
                flightMarkers[flight.callsign].openPopup();
            }
        }

        // Update statistics
        function updateStats(flights) {
            document.getElementById('flightCount').textContent = flights.length;
            
            const avgAlt = flights.reduce((sum, f) => sum + f.altitude, 0) / flights.length;
            document.getElementById('avgAltitude').textContent = Math.round(avgAlt);
            
            const avgSpeed = flights.reduce((sum, f) => sum + (f.velocity * 3.6), 0) / flights.length;
            document.getElementById('avgSpeed').textContent = Math.round(avgSpeed);
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            initMap();
            loadAllFlights();
            
            // Auto-refresh every 30 seconds
            setInterval(() => {
                if (allFlights.length > 0) {
                    loadAllFlights();
                }
            }, 30000);
        });
    </script>
</body>
</html>
