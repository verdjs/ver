<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Airplane body -->
  <path d="M 50 30 L 55 50 L 50 55 L 45 50 Z" fill="#2E86AB" stroke="#1C5D7F" stroke-width="2"/>
  
  <!-- Wings -->
  <path d="M 30 45 L 50 50 L 70 45 L 65 48 L 50 52 L 35 48 Z" fill="#5FA8D3" stroke="#2E86AB" stroke-width="2"/>
  
  <!-- Tail -->
  <path d="M 48 30 L 52 30 L 50 20 Z" fill="#5FA8D3" stroke="#2E86AB" stroke-width="2"/>
  <path d="M 45 32 L 42 35 L 48 33 Z" fill="#5FA8D3" stroke="#2E86AB" stroke-width="2"/>
  <path d="M 55 32 L 58 35 L 52 33 Z" fill="#5FA8D3" stroke="#2E86AB" stroke-width="2"/>
  
  <!-- Windows -->
  <circle cx="50" cy="40" r="2" fill="#87CEEB" stroke="#1C5D7F" stroke-width="1"/>
  <circle cx="50" cy="46" r="2" fill="#87CEEB" stroke="#1C5D7F" stroke-width="1"/>
  
  <!-- Trail lines (motion) -->
  <line x1="30" y1="48" x2="20" y2="50" stroke="#B0B0B0" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  <line x1="70" y1="48" x2="80" y2="50" stroke="#B0B0B0" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  
  <!-- Radar circle -->
  <circle cx="50" cy="75" r="20" fill="none" stroke="#4A90E2" stroke-width="1.5" opacity="0.3"/>
  <circle cx="50" cy="75" r="15" fill="none" stroke="#4A90E2" stroke-width="1.5" opacity="0.4"/>
  <circle cx="50" cy="75" r="10" fill="none" stroke="#4A90E2" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="75" x2="65" y2="80" stroke="#4A90E2" stroke-width="1.5" opacity="0.6"/>
</svg>
