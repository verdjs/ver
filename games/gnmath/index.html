<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Game...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        #loading {
            text-align: center;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #error {
            display: none;
            text-align: center;
            padding: 40px;
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid #ff4444;
            border-radius: 10px;
            max-width: 600px;
        }
        
        #error h2 {
            margin-top: 0;
        }
        
        #error button {
            margin: 10px 5px;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        #error button:hover {
            background: #2980b9;
        }
        
        #error-details {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading game from CDN...</div>
    </div>
    
    <div id="error">
        <h2>Failed to Load Game</h2>
        <p id="error-message"></p>
        <p id="error-details"></p>
        <div>
            <button onclick="window.history.back()">Go Back</button>
            <button onclick="window.location.href='../index.html'">Browse All Games</button>
        </div>
    </div>
    
    <script>
        // Get game parameter from URL
        const urlParams = new URLSearchParams(window.location.search);
        const gameFile = urlParams.get('game');
        
        if (!gameFile) {
            showError('No game specified in URL', 'Please use a valid game link from the games page.');
        } else {
            loadGame(gameFile);
        }
        
        async function loadGame(gameFile) {
            const htmlURL = "https://cdn.jsdelivr.net/gh/gn-math/html@main";
            const url = `${htmlURL}/${gameFile}?t=${Date.now()}`;
            
            console.log('Loading game from:', url);
            
            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error(`Game file not found: ${gameFile}`);
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const html = await response.text();
                
                // Use the same pattern as singlefile.html - write HTML directly to document
                document.open();
                document.write(html);
                document.close();
                
            } catch (error) {
                console.error('Error loading game:', error);
                showError(
                    error.message || 'Failed to load game',
                    `Attempted URL: ${url}\n\nThis game may not be available on the CDN. Please try a different game.`
                );
            }
        }
        
        function showError(message, details = '') {
            document.getElementById('loading').style.display = 'none';
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'block';
            document.getElementById('error-message').textContent = message;
            if (details) {
                document.getElementById('error-details').textContent = details;
            }
        }
    </script>
</body>
</html>
