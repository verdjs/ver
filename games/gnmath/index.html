<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GN Math Games | Verdis</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0f172a;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100vh;
            display: block;
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #fc2651 0%, #e91e47 100%);
            color: white;
            padding: 12px 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            z-index: 1000;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }
        .header a {
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .header a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        #gameFrame {
            margin-top: 50px;
            height: calc(100vh - 50px);
        }
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GN Math Games Collection</h1>
        <a href="../index.html">← Back to Verdis</a>
    </div>
    
    <div class="loader" id="loader">
        <div>Loading GN Math...</div>
        <div style="font-size: 14px; margin-top: 10px; opacity: 0.8;">Access hundreds of games!</div>
    </div>
    
    <iframe id="gameFrame" allow="fullscreen; gamepad; microphone"></iframe>
    
    <script>
        // Load GN Math site
        const gnmathURL = 'https://gn-math.github.io/';
        
        window.addEventListener('DOMContentLoaded', function() {
            const iframe = document.getElementById('gameFrame');
            const loader = document.getElementById('loader');
            
            iframe.src = gnmathURL;
            
            iframe.onload = function() {
                loader.style.display = 'none';
            };
            
            // Hide loader after 3 seconds even if iframe doesn't load
            setTimeout(() => {
                loader.style.display = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
