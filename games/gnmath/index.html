<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Game...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        
        #game-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="game-frame"></iframe>
    
    <script>
        // Get game parameter from URL
        const urlParams = new URLSearchParams(window.location.search);
        const gameFile = urlParams.get('game');
        
        if (gameFile) {
            // Load game from CDN into iframe
            const iframe = document.getElementById('game-frame');
            const cdnUrl = `https://cdn.jsdelivr.net/gh/gn-math/html@main/${gameFile}`;
            
            // Set the iframe src to the CDN URL
            iframe.src = cdnUrl;
        } else {
            document.body.innerHTML = '<div style="color: white; text-align: center; padding: 50px;">Error: No game specified</div>';
        }
    </script>
</body>
</html>
