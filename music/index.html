<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/images/ico.ico" type="image/x-icon">
    <link rel="stylesheet" href="/storage/css/music.css">
    <title>Music Player | Verdis</title>

    <meta name="description" content="Music player powered by Piped API">
    <meta property="og:site_name" content="verdjs">
    <meta property="og:title" content="verdjs music player">
    <meta property="og:type" content="website">
</head>
<body>

    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>

    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>
    <div class="snowflake"></div>

    <div class="music-container">
        <h1>Music Player</h1>
        <p class="linkp"><a href="/index.html">back to portfolio</a></p>

        <div class="player-box">
            <div class="search-section">
                <input type="text" id="searchQuery" placeholder="🔍 Search for music..." autocomplete="off">
                <button id="searchBtn">Search</button>
            </div>

            <div id="searchResults" class="search-results"></div>

            <div class="player-section">
                <div id="currentTrack" class="current-track">
                    <p>No track selected</p>
                </div>
                
                <div id="playerFrame" class="player-frame">
                    <!-- Audio player will be embedded here -->
                </div>

                <div class="controls">
                    <button id="prevBtn" disabled>⏮ Previous</button>
                    <button id="playPauseBtn" disabled>▶ Play</button>
                    <button id="nextBtn" disabled>⏭ Next</button>
                </div>
            </div>

            <div class="playlist-section">
                <h3>Playlist</h3>
                <div id="playlist" class="playlist">
                    <p class="empty-playlist">Your playlist is empty. Search and add songs!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let playlist = [];
        let currentTrackIndex = -1;
        let audioPlayer = null;
        
        // Piped API configuration
        const PIPED_API = 'https://pipedapi.kavin.rocks';

        // Search for music using Piped API
        async function searchMusic(query) {
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = '<p>Searching...</p>';

            try {
                const response = await fetch(`${PIPED_API}/search?q=${encodeURIComponent(query)}&filter=music_songs`);
                
                if (!response.ok) {
                    throw new Error('Search failed');
                }
                
                const data = await response.json();
                const items = data.items || [];
                
                if (items.length === 0) {
                    searchResults.innerHTML = '<p>No results found. Try a different search term.</p>';
                    return;
                }
                
                // Display search results
                searchResults.innerHTML = items.slice(0, 10).map(item => `
                    <div class="result-item" onclick="addSearchResult('${item.url.replace('/watch?v=', '')}', '${escapeHtml(item.title)}', '${escapeHtml(item.uploaderName || 'Unknown Artist')}')">
                        <img src="${item.thumbnail}" alt="${escapeHtml(item.title)}" style="width: 120px; height: 90px; object-fit: cover; border-radius: 8px; margin-right: 15px;">
                        <div style="flex: 1;">
                            <h4 style="margin: 0 0 5px 0;">${escapeHtml(item.title)}</h4>
                            <p style="margin: 0; opacity: 0.7; font-size: 14px;">${escapeHtml(item.uploaderName || 'Unknown Artist')}</p>
                            ${item.duration ? `<p style="margin: 5px 0 0 0; opacity: 0.7; font-size: 12px;">Duration: ${formatDuration(item.duration)}</p>` : ''}
                        </div>
                        <button onclick="event.stopPropagation(); addSearchResult('${item.url.replace('/watch?v=', '')}', '${escapeHtml(item.title)}', '${escapeHtml(item.uploaderName || 'Unknown Artist')}')" style="padding: 8px 16px;">Add</button>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Search error:', error);
                searchResults.innerHTML = '<p>Search failed. Please try again or use a different Piped instance.</p>';
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatDuration(seconds) {
            if (!seconds) return '';
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }
        
        function addSearchResult(videoId, title, artist) {
            const track = {
                id: videoId,
                videoId: videoId,
                title: title,
                artist: artist
            };
            
            addToPlaylist(track);
            
            // Clear search results after adding
            document.getElementById('searchResults').innerHTML = '<p style="color: #4ade80;">Added to playlist!</p>';
            setTimeout(() => {
                document.getElementById('searchResults').innerHTML = '';
            }, 2000);
        }

        function addToPlaylist(track) {
            playlist.push(track);
            updatePlaylistUI();
            
            if (playlist.length === 1) {
                playTrack(0);
            }
        }

        function updatePlaylistUI() {
            const playlistEl = document.getElementById('playlist');
            
            if (playlist.length === 0) {
                playlistEl.innerHTML = '<p class="empty-playlist">Your playlist is empty. Search and add songs!</p>';
                return;
            }

            playlistEl.innerHTML = playlist.map((track, index) => `
                <div class="playlist-item ${index === currentTrackIndex ? 'active' : ''}" onclick="playTrack(${index})">
                    <span>${index + 1}. ${track.title}${track.artist ? ` - ${track.artist}` : ''}</span>
                    <button onclick="event.stopPropagation(); removeTrack(${index})">×</button>
                </div>
            `).join('');
        }

        async function playTrack(index) {
            if (index < 0 || index >= playlist.length) return;

            currentTrackIndex = index;
            const track = playlist[index];

            document.getElementById('currentTrack').innerHTML = `
                <p><strong>Now Playing:</strong> ${track.title}${track.artist ? ` - ${track.artist}` : ''}</p>
            `;
            
            const playerFrame = document.getElementById('playerFrame');
            playerFrame.innerHTML = '<p>Loading audio...</p>';

            try {
                // Fetch stream info from Piped API
                const response = await fetch(`${PIPED_API}/streams/${track.videoId}`);
                
                if (!response.ok) {
                    throw new Error('Failed to get stream info');
                }
                
                const streamData = await response.json();
                
                // Get the best audio stream
                const audioStream = streamData.audioStreams?.find(s => s.quality === 'AUDIO_QUALITY_MEDIUM') 
                    || streamData.audioStreams?.[0];
                
                if (!audioStream) {
                    throw new Error('No audio stream available');
                }
                
                // Create HTML5 audio player
                playerFrame.innerHTML = `
                    <audio id="audioPlayer" controls autoplay style="width: 100%;">
                        <source src="${audioStream.url}" type="${audioStream.mimeType || 'audio/mp4'}">
                        Your browser does not support the audio element.
                    </audio>
                `;
                
                audioPlayer = document.getElementById('audioPlayer');
                
                // Auto-play next track when current ends
                audioPlayer.onended = () => {
                    if (currentTrackIndex < playlist.length - 1) {
                        playTrack(currentTrackIndex + 1);
                    }
                };
                
            } catch (error) {
                console.error('Playback error:', error);
                playerFrame.innerHTML = '<p style="color: #ff4444;">Failed to load audio. Please try another track.</p>';
            }

            updatePlaylistUI();
            updateControls();
        }

        function updateControls() {
            document.getElementById('prevBtn').disabled = currentTrackIndex <= 0;
            document.getElementById('nextBtn').disabled = currentTrackIndex >= playlist.length - 1;
            document.getElementById('playPauseBtn').disabled = playlist.length === 0;
        }

        function removeTrack(index) {
            playlist.splice(index, 1);
            
            if (index === currentTrackIndex) {
                if (playlist.length > 0) {
                    playTrack(Math.min(index, playlist.length - 1));
                } else {
                    currentTrackIndex = -1;
                    document.getElementById('currentTrack').innerHTML = '<p>No track selected</p>';
                    document.getElementById('playerFrame').innerHTML = '';
                }
            } else if (index < currentTrackIndex) {
                currentTrackIndex--;
            }
            
            updatePlaylistUI();
            updateControls();
        }

        // Event listeners
        document.getElementById('searchBtn').addEventListener('click', () => {
            const query = document.getElementById('searchQuery').value;
            if (query.trim()) {
                searchMusic(query);
            }
        });

        document.getElementById('searchQuery').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('searchBtn').click();
            }
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentTrackIndex > 0) {
                playTrack(currentTrackIndex - 1);
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentTrackIndex < playlist.length - 1) {
                playTrack(currentTrackIndex + 1);
            }
        });

        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (audioPlayer) {
                if (audioPlayer.paused) {
                    audioPlayer.play();
                } else {
                    audioPlayer.pause();
                }
            } else if (currentTrackIndex >= 0) {
                playTrack(currentTrackIndex);
            }
        });

        // Initialize
        updateControls();
    </script>

    <script src="/storage/js/cloak.js"></script>
    <script src="/storage/js/theme.js"></script>
    <script src="/storage/js/cookie.js"></script>
</body>
